spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    hikari:
      schema: ${DATABASE_SCHEMA:probe}
  flyway:
    default-schema: ${DATABASE_SCHEMA:probe}
service:
  max-request-bytes: 1048576
management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: local
